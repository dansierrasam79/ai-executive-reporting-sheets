<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <style>
      body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 16px; background-color: #fafafa; }
      h3 { margin-top: 0; color: #1a73e8; font-size: 16px; }
      #chat-history { height: 350px; overflow-y: auto; background: #fff; border: 1px solid #ddd; border-radius: 8px; padding: 12px; margin-bottom: 12px; font-size: 13px; line-height: 1.4; }
      .message { margin-bottom: 10px; padding: 8px 12px; border-radius: 12px; max-width: 85%; }
      .user { background: #1a73e8; color: #fff; margin-left: auto; border-bottom-right-radius: 2px; }
      .bot { background: #f1f3f4; color: #202124; border-bottom-left-radius: 2px; }
      .input-box { display: flex; gap: 6px; }
      input[type="text"] { flex: 1; padding: 10px; border: 1px solid #dadce0; border-radius: 6px; font-size: 13px; outline: none; }
      button { background: #1a73e8; color: white; border: none; padding: 10px 16px; border-radius: 6px; font-size: 13px; cursor: pointer; }
      button:disabled { background: #ccc; }
    </style>
  </head>
  <body>
    <h3>🤖 Chat with Your Data</h3>
    <div id="chat-history">
      <div class="message bot">Hello! Ask me any question about your revenue, margins, or products.</div>
    </div>
    <div class="input-box">
      <input type="text" id="userInput" placeholder="Ask a question..." onkeydown="if(event.key === 'Enter') sendQuery()" />
      <button id="sendBtn" onclick="sendQuery()">Send</button>
    </div>

    <script>
      function sendQuery() {
        const input = document.getElementById("userInput");
        const query = input.value.trim();
        if (!query) return;

        appendMessage("user", query);
        input.value = "";
        document.getElementById("sendBtn").disabled = true;

        google.script.run
          .withSuccessHandler(function(response) {
            appendMessage("bot", response);
            document.getElementById("sendBtn").disabled = false;
          })
          .withFailureHandler(function(err) {
            appendMessage("bot", "Error: " + err.message);
            document.getElementById("sendBtn").disabled = false;
          })
          .askGeminiAnalyst(query);
      }

      function appendMessage(sender, text) {
        const history = document.getElementById("chat-history");
        const msg = document.createElement("div");
        msg.className = "message " + sender;
        msg.innerText = text;
        history.appendChild(msg);
        history.scrollTop = history.scrollHeight;
      }
    </script>
  </body>
</html>
